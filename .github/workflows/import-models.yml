name: Import browser ONNX models

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-models:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_ARCHIVE_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-ace8-81fd-babc-e3a05d633228/raw?se=2026-08-16T23%3A11%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=d1dc9112-b3e1-4770-9fe4-d77399e6938f&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T16%3A46%3A47Z&ske=2026-08-17T16%3A46%3A47Z&sks=b&skv=2026-02-06&sig=NXWsM0C6yCQx5%2BMl31oRQSAWalfSlNOj4R0cZx/vl88%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify model archive
        run: |
          curl --fail --location --retry 5 --retry-delay 5 "$MODEL_ARCHIVE_URL" --output /tmp/receipt-browser-models.tar
          tar -xf /tmp/receipt-browser-models.tar
          test "$(find public/models -type f -path '*/onnx/chunks/*.part-*' | wc -l)" -eq 28
      - name: Commit browser models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models
          git commit -m "Add quantized browser ONNX models"
          git push
